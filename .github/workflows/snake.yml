name: Generate Contribution Graphics

on:
  schedule:
    # 12時間ごとに自動更新
    - cron: "0 */12 * * *"
  # 手動実行も可能
  workflow_dispatch:
  # main への push でも実行
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # checkout は必ず先に。あとで実行すると dist/ が消される
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate contribution-calendar.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_CALENDAR_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist
        run: node .github/scripts/contribution-calendar.mjs

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
